name: Kasauti CD Sync & Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-and-deploy:
    name: Sync Training Data to Supabase & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install Levenshtein scipy supabase

      - name: Validate Contributor Annotations & Audio Headers
        run: |
          python scripts/validate_contributions.py

      - name: Sync Contributor Speech Datasets to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET_NAME: ${{ secrets.SUPABASE_BUCKET_NAME || 'kasauti-audio-artifacts' }}
        run: |
          python scripts/sync_training_data.py

      - name: Verify API Docker Build Readiness
        run: |
          docker build -t kasauti-api:latest -f apps/api/Dockerfile .

